# AlHakim — fallback when user opens a share link in the browser (app not installed).
# App Links still work: installed apps intercept https://alhakim-eg.com/doctor/*/book
# before the browser loads this URL.
#
# Place inside the alhakim-eg.com server block, then reload nginx.

location ~ ^/doctor/[^/]+/book/?$ {
    return 302 https://alhakim-eg.com/;
}

# Required for Android App Links verification (keep as JSON, no redirect):
# location = /.well-known/assetlinks.json { ... }
